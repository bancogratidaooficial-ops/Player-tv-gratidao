<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>V86 PLAY - Músicas</title><link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff;text-align:center;padding:10px;padding-bottom:100px}
.top{display:flex;gap:8px;margin-bottom:12px}.top a{flex:1;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold;background:#222;color:#FFD700;border:2px solid #FFD700}.top a.active{background:#FFD700;color:#000}
.busca{display:flex;gap:8px;margin-bottom:12px}.busca input{flex:1;padding:14px;border-radius:12px;border:2px solid #FFD700;background:#111;color:#fff}.busca button{background:#FFD700;border:none;padding:0 22px;border-radius:12px;font-weight:bold;color:#000}
.card{border:2px solid #FFD700;border-radius:20px;padding:15px;background:#111}audio{width:100%;margin:10px 0}iframe{width:100%;height:180px;border:none;border-radius:12px;margin:10px 0;background:#000}
#nome{color:#FFD700;font-weight:bold;margin:8px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#status{color:#25D366;font-size:13px;margin:5px}
.btns{display:flex;justify-content:center;gap:10px;margin:15px 0}.btns button{background:#FFD700;border:none;width:60px;height:60px;border-radius:50%;font-size:20px}.btns button.peq{width:45px;height:45px;background:#222;border:2px solid #FFD700}
.lista{text-align:left;background:#1a1a1a;border-radius:12px;padding:5px;max-height:400px;overflow:auto;margin:12px 0}
.item{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid #333}.item.active{background:#222;border-radius:8px}.item img{width:50px;height:50px;border-radius:8px;object-fit:cover}.item div{flex:1;overflow:hidden;text-align:left}.item div b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.item div small{color:#aaa;font-size:12px}.del{background:#ff2a2a;color:#fff;border:none;width:35px;height:35px;border-radius:50%}
.act{border:2px solid #FFD700;background:#111;color:#FFD700;padding:10px;border-radius:10px;font-weight:bold;flex:1}
.green{background:#00d26a;color:#fff;border:none;padding:16px;border-radius:12px;width:100%;font-weight:bold;font-size:16px;margin-top:10px}
.share{display:flex;gap:8px;margin-top:10px}.share button{flex:1;padding:14px;border-radius:12px;font-weight:bold;border:none}
</style>
</head>
<body>
<div class="top"><a href="index.html" class="active">🎵 MÚSICAS</a><a href="video.html">🎬 VÍDEOS</a></div>
<div class="busca"><input type="text" id="q" placeholder="🔍 Buscar música fora - ex: Leonardo"><button onclick="buscar()">Buscar</button></div>
<div class="card">
<audio id="audio" controls style="display:none"></audio><iframe id="yt" style="display:none" allow="autoplay; encrypted-media"></iframe>
<div id="nome">Pronto para buscar</div><div id="status">Busca na internet igual Pluto.tv</div><div id="cont" style="color:#aaa">0 músicas</div>
<div class="btns"><button class="peq" onclick="aleat()">🔀</button><button onclick="ant()">⏮</button><button style="width:80px;height:80px;font-size:30px" onclick="pp()">▶️</button><button onclick="prox()">⏭</button><button class="peq" onclick="rep()">🔁</button></div>
<div class="lista" id="lista"></div>
<div style="display:flex;gap:8px;margin-top:10px"><button class="act" onclick="backup()">💾 Backup</button><button class="act" onclick="document.getElementById('rest').click()">♻️ Restaurar</button><button class="act" onclick="resetar()">🗑️ Resetar</button></div>
<input type="file" id="rest" style="display:none">
</div>
<button class="green" onclick="document.getElementById('file').click()">➕ Adicionar Músicas do Celular</button><input type="file" id="file" multiple accept="audio/*" style="display:none">
<button class="green" style="background:#111;border:2px solid #FFD700;color:#FFD700" onclick="addLink()">🔗 Adicionar por Link (YouTube / MP3)</button>
<div class="share"><button style="background:#25D366;color:#fff" onclick="compartilhar()">📲 Compartilhar</button><button style="background:#FFD700;color:#000" onclick="convidar()">👥 Convidar</button></div>
<p style="margin:20px"><a href="privacidade.html" style="color:#FFD700">Privacidade</a> | <a href="termos.html" style="color:#FFD700">Termos</a> | <a href="contato.html" style="color:#FFD700">Contato</a></p>
<script>
let musicas=[], idx=0, ale=false, repe=false; const audio=document.getElementById('audio'), yt=document.getElementById('yt'), nome=document.getElementById('nome'), lista=document.getElementById('lista'), cont=document.getElementById('cont'), statusEl=document.getElementById('status'); let db;
const req=indexedDB.open('V86DB',2); req.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('musicas')) e.target.result.createObjectStore('musicas',{keyPath:'id',autoIncrement:true});};
req.onsuccess=async e=>{db=e.target.result; await carregarGlobal(); carregarLocal();};
async function carregarGlobal(){ try{ const r=await fetch('./musicas/lista.json?v='+Date.now()); if(r.ok){ const j=await r.json(); j.forEach(m=>{musicas.push({id:'g_'+m.arquivo, nome:m.titulo, url:'./musicas/'+m.arquivo, tipo:'mp3', thumb:'', videoId:'', global:true});}); } }catch(e){} }
function carregarLocal(){ db.transaction('musicas','readonly').objectStore('musicas').getAll().onsuccess=e=>{ e.target.result.forEach(r=>{musicas.push({id:r.id, nome:r.nome, url:r.url||URL.createObjectURL(r.blob), tipo:r.tipo||'mp3', thumb:r.thumb||'', videoId:r.videoId||'', global:false, blobId:r.id});}); montar(); };}
function montar(){ cont.innerText=musicas.length+' músicas salvas'; if(!musicas.length){nome.innerText='Busque uma música acima'; render(); return;} render(); if(!audio.src &&!yt.src) carregar(0);}
function render(){ lista.innerHTML=''; musicas.forEach((m,i)=>{ const d=document.createElement('div'); d.className='item'+(i==idx?' active':''); const img=document.createElement('img'); img.src=m.thumb||'https://i.ytimg.com/vi/'+(m.videoId||'dQw4w9WgXcQ')+'/mqdefault.jpg'; img.onerror=()=>img.src='https://via.placeholder.com/50/111/FFD700?text=♪';
  const txt=document.createElement('div'); txt.innerHTML='<b>'+m.nome+'</b><small>'+(m.tipo=='yt'?'YouTube - fora do app':'Celular')+(m.global?' 🌎':'')+'</small>'; txt.onclick=()=>{carregar(i); if(m.tipo!='yt') audio.play();};
  const b=document.createElement('button'); b.className='del'; b.innerText='🗑️'; b.onclick=()=>{ if(m.global){alert('Global só no GitHub'); return;} const tx=db.transaction('musicas','readwrite'); tx.objectStore('musicas').delete(m.blobId); tx.oncomplete=()=>location.reload(); };
  d.appendChild(img); d.appendChild(txt); d.appendChild(b); lista.appendChild(d); });}
function carregar(i){ idx=i; const m=musicas[i]; nome.innerText=m.nome; if(m.tipo=='yt'){ audio.style.display='none'; audio.pause(); yt.style.display='block'; yt.src=m.url; statusEl.innerText='▶️ Tocando YouTube (fora do app) - áudio'; } else { yt.style.display='none'; yt.src=''; audio.style.display='block'; audio.src=m.url; statusEl.innerText='📱 Tocando do celular'; } render();}
function pp(){ const m=musicas[idx]; if(!m) return; if(m.tipo=='yt'){ statusEl.innerText='Use o play dentro do vídeo do YouTube'; } else { audio.paused?audio.play():audio.pause(); }}
function prox(){ if(!musicas.length) return; let n=ale?Math.floor(Math.random()*musicas.length):(idx+1)%musicas.length; carregar(n); if(musicas[n].tipo!='yt') audio.play(); }
function ant(){ if(!musicas.length) return; carregar((idx-1+musicas.length)%musicas.length); if(musicas[idx].tipo!='yt') audio.play(); }
function aleat(){ ale=!ale; alert(ale?'Aleatório ON':'OFF'); } function rep(){ repe=!repe; audio.loop=repe; alert(repe?'Repetir ON':'OFF'); }
function resetar(){ if(confirm('Apagar suas músicas locais?')){ const tx=db.transaction('musicas','readwrite'); tx.objectStore('musicas').clear(); tx.oncomplete=()=>location.reload(); }}
function backup(){ alert('Já fica salvo automático no celular'); }
function getYtId(u){ const m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/)([^&?/]+)/); return m?m[1]:null; }
function addLink(){
 const link=prompt('Cole link YouTube ou MP3 direto:'); if(!link) return; const titulo=prompt('Nome da música:')||'Música';
 let tipo='mp3', url=link, thumb='', vid=''; const id=getYtId(link); if(id){ tipo='yt'; url='https://www.youtube.com/embed/'+id; thumb='https://i.ytimg.com/vi/'+id+'/mqdefault.jpg'; vid=id; }
 const tx=db.transaction('musicas','readwrite'); tx.objectStore('musicas').add({nome:titulo, url:url, tipo:tipo, thumb:thumb, videoId:vid, blob:new Blob([])}); tx.oncomplete=()=>location.reload();
}
async function buscar(){
 const q=document.getElementById('q').value.trim(); if(!q) return; statusEl.innerText='🌎 Buscando fora: '+q; nome.innerText='Buscando músicas...';
 try{
   const apis=[
     'https://pipedapi.kavin.rocks/search?q='+encodeURIComponent(q)+'&filter=music_songs',
     'https://pipedapi.kavin.rocks/search?q='+encodeURIComponent(q)+'&filter=videos',
     'https://pipedapi.moomoo.me/search?q='+encodeURIComponent(q)+'&filter=videos'
   ];
   let data=null;
   for(const api of apis){ try{ const r=await fetch(api); if(r.ok){ const j=await r.json(); const arr=j.items||j; if(arr && arr.length){ data=arr; break; } } }catch(e){} }
   if(!data ||!data.length) throw new Error();
   statusEl.innerText='✅ '+data.length+' músicas encontradas fora!';
   for(let i=Math.min(data.length,12)-1;i>=0;i--){
     const it=data[i]; const vid=it.url?.split('v=')[1]?.split('&')[0]||it.url?.split('/').pop()||it.videoId||it.id; if(!vid) continue;
     if(musicas.some(m=>m.videoId==vid)) continue;
     const titulo=it.title||it.name; const thumb=it.thumbnail||'https://i.ytimg.com/vi/'+vid+'/mqdefault.jpg'; const url='https://www.youtube.com/embed/'+vid;
     musicas.unshift({id:Date.now()+i, nome:titulo, url:url, tipo:'yt', thumb:thumb, videoId:vid, global:false});
     const tx=db.transaction('musicas','readwrite'); tx.objectStore('musicas').add({nome:titulo, url:url, tipo:'yt', thumb:thumb, videoId:vid, blob:new Blob([])});
   }
   montar(); carregar(0);
 }catch(e){ statusEl.innerText='Erro - abrindo YouTube'; window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q),'_blank'); }
}
function compartilhar(){ const l=location.href; if(navigator.share){navigator.share({title:'V86 PLAY',url:l});} else {navigator.clipboard.writeText(l); alert('Copiado: '+l);} }
function convidar(){ window.open('https://wa.me/?text='+encodeURIComponent('🎧 V86 PLAY LIST 👉 '+location.href),'_blank'); }
document.getElementById('file').addEventListener('change', async e=>{ for(const file of e.target.files){ await new Promise(r=>{ const tx=db.transaction('musicas','readwrite'); tx.objectStore('musicas').add({nome:file.name, blob:file, tipo:'mp3', url:'', thumb:''}); tx.oncomplete=r; }); } location.reload(); });
audio.onended=()=>{ if(!repe) prox(); };
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
