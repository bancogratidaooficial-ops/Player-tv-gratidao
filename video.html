<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>V86 PLAY - Vídeos</title><link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff;text-align:center;padding:10px;padding-bottom:100px}
.top{display:flex;gap:8px;margin-bottom:12px}.top a{flex:1;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold;background:#222;color:#FFD700;border:2px solid #FFD700}.top a.active{background:#FFD700;color:#000}
.busca{display:flex;gap:8px;margin-bottom:12px}.busca input{flex:1;padding:14px;border-radius:12px;border:2px solid #FFD700;background:#111;color:#fff}.busca button{background:#FFD700;border:none;padding:0 22px;border-radius:12px;font-weight:bold}
.card{border:2px solid #FFD700;border-radius:20px;padding:15px;background:#111}video,iframe{width:100%;height:200px;border:none;border-radius:12px;margin:10px 0;background:#000}
#nome{color:#FFD700;font-weight:bold;margin:8px 0}#status{color:#25D366;font-size:13px}
.btns{display:flex;justify-content:center;gap:10px;margin:15px 0;flex-wrap:wrap}.btns button{background:#FFD700;border:none;width:60px;height:60px;border-radius:50%;font-size:20px}.btns button.big{width:80px;height:80px;font-size:30px}.btns button.mini{width:50px;height:50px;background:#222;border:2px solid #FFD700;font-size:18px}
.vel{display:flex;justify-content:center;gap:8px;margin:10px 0}.vel button{background:#222;border:2px solid #FFD700;color:#FFD700;padding:8px 12px;border-radius:10px;font-weight:bold}.vel button.active{background:#FFD700;color:#000}
.lista{text-align:left;background:#1a1a1a;border-radius:12px;padding:5px;max-height:400px;overflow:auto;margin:12px 0}
.item{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid #333}.item.active{background:#222;border-radius:8px}.item img{width:70px;height:45px;border-radius:8px;object-fit:cover}.item div{flex:1;overflow:hidden;text-align:left}.item div b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.item div small{color:#aaa;font-size:12px}.del{background:#ff2a2a;color:#fff;border:none;width:35px;height:35px;border-radius:50%}
.act{border:2px solid #FFD700;background:#111;color:#FFD700;padding:10px;border-radius:10px;font-weight:bold;flex:1}
.green{background:#00d26a;color:#fff;border:none;padding:16px;border-radius:12px;width:100%;font-weight:bold;font-size:16px;margin-top:10px}
.share{display:flex;gap:8px;margin-top:10px}.share button{flex:1;padding:14px;border-radius:12px;font-weight:bold;border:none}
</style>
</head>
<body>
<div class="top"><a href="index.html">🎵 MÚSICAS</a><a href="video.html" class="active">🎬 VÍDEOS</a></div>
<div class="busca"><input type="text" id="q" placeholder="🔍 Buscar filme - ex: Presos no tempo"><button onclick="buscar()">Buscar</button></div>
<div class="card" id="playerBox">
<video id="video" controls style="display:none" playsinline></video><iframe id="yt" style="display:none" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
<div id="nome">Pronto para buscar</div><div id="status">Busca na internet igual Pluto.tv</div><div id="cont" style="color:#aaa">0 vídeos</div>
<div class="vel"><button onclick="setVel(0.5)" id="v05">0.5x</button><button onclick="setVel(1)" id="v1" class="active">1x</button><button onclick="setVel(1.5)" id="v15">1.5x</button><button onclick="setVel(2)" id="v2">2x</button></div>
<div class="btns"><button class="mini" onclick="telaCheia()">⛶</button><button class="mini" onclick="pip()">🖼️</button><button onclick="ant()">⏮</button><button class="big" onclick="pp()">▶️</button><button onclick="prox()">⏭</button><button class="mini" onclick="aleat()">🔀</button></div>
<div class="lista" id="lista"></div>
<div style="display:flex;gap:8px;margin-top:10px"><button class="act" onclick="backup()">💾 Backup</button><button class="act" onclick="document.getElementById('rest').click()">♻️ Restaurar</button><button class="act" onclick="resetar()">🗑️ Resetar</button></div>
<input type="file" id="rest" style="display:none">
</div>
<button class="green" onclick="document.getElementById('file').click()">➕ Adicionar Vídeos do Celular</button><input type="file" id="file" multiple accept="video/*" style="display:none">
<button class="green" style="background:#111;border:2px solid #FFD700;color:#FFD700" onclick="addLink()">🔗 Adicionar por Link</button>
<div class="share"><button style="background:#25D366;color:#fff" onclick="compartilhar()">📲 Compartilhar</button><button style="background:#FFD700;color:#000" onclick="convidar()">👥 Convidar</button></div>
<script>
let videos=[], idx=0, ale=false; const video=document.getElementById('video'), yt=document.getElementById('yt'), nome=document.getElementById('nome'), lista=document.getElementById('lista'), cont=document.getElementById('cont'), statusEl=document.getElementById('status'), box=document.getElementById('playerBox'); let db;
const req=indexedDB.open('V86DB_VID',2); req.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('videos')) e.target.result.createObjectStore('videos',{keyPath:'id',autoIncrement:true});};
req.onsuccess=async e=>{db=e.target.result; await carregarGlobal(); carregarLocal();};
async function carregarGlobal(){ try{ const r=await fetch('./videos/lista.json?v='+Date.now()); if(r.ok){ const j=await r.json(); j.forEach(v=>{videos.push({id:'g_'+v.arquivo, nome:v.titulo, url:'./videos/'+v.arquivo, tipo:'mp4', thumb:'', videoId:'', global:true});}); } }catch(e){} }
function carregarLocal(){ db.transaction('videos','readonly').objectStore('videos').getAll().onsuccess=e=>{ e.target.result.forEach(r=>{videos.push({id:r.id, nome:r.nome, url:r.url||URL.createObjectURL(r.blob), tipo:r.tipo||'mp4', thumb:r.thumb||'', videoId:r.videoId||'', global:false, blobId:r.id});}); montar(); };}
function montar(){ cont.innerText=videos.length+' vídeos salvos'; if(!videos.length){nome.innerText='Busque um filme acima'; render(); return;} render(); if(!video.src &&!yt.src) carregar(0);}
function render(){ lista.innerHTML=''; videos.forEach((m,i)=>{ const d=document.createElement('div'); d.className='item'+(i==idx?' active':''); const img=document.createElement('img'); img.src=m.thumb||(m.videoId?'https://i.ytimg.com/vi/'+m.videoId+'/mqdefault.jpg':'https://via.placeholder.com/70x45/111/FFD700?text=🎬'); const txt=document.createElement('div'); txt.innerHTML='<b>'+m.nome+'</b><small>'+(m.tipo=='yt'?'YouTube':'Celular')+'</small>'; txt.onclick=()=>{carregar(i); if(m.tipo!='yt') video.play();}; const b=document.createElement('button'); b.className='del'; b.innerText='🗑️'; b.onclick=()=>{ const tx=db.transaction('videos','readwrite'); tx.objectStore('videos').delete(m.blobId); tx.oncomplete=()=>location.reload(); }; d.appendChild(img); d.appendChild(txt); d.appendChild(b); lista.appendChild(d); });}
function carregar(i){ idx=i; const m=videos[i]; nome.innerText=m.nome; if(m.tipo=='yt'){ video.style.display='none'; video.pause(); yt.style.display='block'; yt.src=m.url; } else { yt.style.display='none'; yt.src=''; video.style.display='block'; video.src=m.url; } render();}
function pp(){ const m=videos[idx]; if(!m) return; if(m.tipo=='yt') return; video.paused?video.play():video.pause(); }
function prox(){ if(!videos.length) return; carregar((idx+1)%videos.length); } function ant(){ carregar((idx-1+videos.length)%videos.length); }
function aleat(){ ale=!ale; alert(ale?'Aleatório ON':'OFF'); } function setVel(v){ video.playbackRate=v; document.querySelectorAll('.vel button').forEach(b=>b.classList.remove('active')); document.getElementById('v'+String(v).replace('.','')).classList.add('active'); }
function telaCheia(){ if(yt.style.display!='none'){ if(yt.requestFullscreen) yt.requestFullscreen(); else if(box.requestFullscreen) box.requestFullscreen(); } else { if(video.requestFullscreen) video.requestFullscreen(); } }
async function pip(){ try{ if(video.style.display!='none'){ if(document.pictureInPictureElement) await document.exitPictureInPicture(); else await video.requestPictureInPicture(); } else { alert('PIP só em vídeo do celular, use ⛶ pra YouTube'); } }catch(e){ alert('Sem suporte a PIP'); } }
function resetar(){ if(confirm('Apagar?')){ const tx=db.transaction('videos','readwrite'); tx.objectStore('videos').clear(); tx.oncomplete=()=>location.reload(); }}
function backup(){ alert('Salvo automático'); }
function getYtId(u){ const m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/)([^&?/]+)/); return m?m[1]:null; }
function addLink(){ const link=prompt('Cole link YouTube ou MP4:'); if(!link) return; const titulo=prompt('Nome:')||'Vídeo'; let tipo='mp4', url=link, thumb='', vid=''; const id=getYtId(link); if(id){ tipo='yt'; url='https://www.youtube.com/embed/'+id; thumb='https://i.ytimg.com/vi/'+id+'/mqdefault.jpg'; vid=id; } const tx=db.transaction('videos','readwrite'); tx.objectStore('videos').add({nome:titulo, url:url, tipo:tipo, thumb:thumb, videoId:vid, blob:new Blob([])}); tx.oncomplete=()=>location.reload(); }
async function buscar(){ const q=document.getElementById('q').value.trim(); if(!q) return; statusEl.innerText='🌎 Buscando: '+q; try{ const apis=['https://pipedapi.kavin.rocks/search?q='+encodeURIComponent(q)+'&filter=videos']; let data=null; for(const api of apis){ const r=await fetch(api); const j=await r.json(); const arr=j.items||j; if(arr.length){ data=arr; break; } } statusEl.innerText='✅ '+data.length+' encontrados!'; for(let i=Math.min(data.length,20)-1;i>=0;i--){ const it=data[i]; const vid=it.url?.split('v=')[1]?.split('&')[0]||it.id; if(videos.some(m=>m.videoId==vid)) continue; videos.unshift({id:Date.now()+i, nome:it.title, url:'https://www.youtube.com/embed/'+vid, tipo:'yt', thumb:it.thumbnail, videoId:vid}); const tx=db.transaction('videos','readwrite'); tx.objectStore('videos').add({nome:it.title, url:'https://www.youtube.com/embed/'+vid, tipo:'yt', thumb:it.thumbnail, videoId:vid, blob:new Blob([])}); } montar(); carregar(0); }catch(e){ window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q),'_blank'); } }
function compartilhar(){ const l=location.href; if(navigator.share) navigator.share({title:'V86',url:l}); else {navigator.clipboard.writeText(l); alert('Copiado');} }
function convidar(){ window.open('https://wa.me/?text='+encodeURIComponent('🎬 V86 FILMES 👉 '+location.href),'_blank'); }
document.getElementById('file').addEventListener('change', async e=>{ for(const file of e.target.files){ await new Promise(r=>{ const tx=db.transaction('videos','readwrite'); tx.objectStore('videos').add({nome:file.name, blob:file, tipo:'mp4', url:'', thumb:''}); tx.oncomplete=r; }); } location.reload(); });
video.onended=()=>prox();
</script>
</body>
</html>
